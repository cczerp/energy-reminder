<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1833">
<title>Mindful</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>
<nav id="tabs">
  <a href="#today" data-tab="today">Today</a>
  <a href="#practice" data-tab="practice">Practice</a>
  <a href="#log" data-tab="log">Log</a>
  <a href="#settings" data-tab="settings">Settings</a>
</nav>
<script>
(function () {
  var errs = [];
  function add(m) { errs.push(String(m).replace(/</g, '&lt;')); }
  window.addEventListener('error', function (e) {
    add((e.message || 'script problem') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    if (e.target && e.target.src) add('could not load ' + e.target.src.split('/').pop());
  }, true);
  window.addEventListener('unhandledrejection', function (e) { add('promise: ' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function () {
    var v = document.getElementById('view');
    if (window.__mindfulBooted && v && v.innerHTML.replace(/\s/g, '')) return;
    v.innerHTML = '<div style="padding:16px;color:#f2c94c;font-size:14px;line-height:1.5">Mindful did not finish starting.<br><br>Please screenshot this screen and send it.<br><br><b>Phone engine:</b> ' +
      navigator.userAgent.replace(/</g, '&lt;') + '<br><br><b>Problems found:</b><br>' + (errs.join('<br>') || 'none reported') + '</div>';
  }, 3500);
})();
</script>
<script nomodule>
document.getElementById('view').innerHTML = '<div style="padding:16px;color:#f2c94c;font-size:15px">This phone\'s web engine is too old to run Mindful.<br><br>Open the Play Store, search for "Android System WebView" and "Google Chrome", update both, then reopen Mindful.</div>';
</script>
<script src="capacitor.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
