<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1833">
<title>Mindful</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">

<body>
<main id="view"></main>
<nav id="tabs">
  <a href="#today" data-tab="today">Today</a>
  <a href="#practice" data-tab="practice">Practice</a>
  <a href="#log" data-tab="log">Log</a>
  <a href="#settings" data-tab="settings">Settings</a>
</nav>
<script>
window.addEventListener('error', function (e) {
  var v = document.getElementById('view');
  if (v && !v.innerHTML.trim()) v.innerHTML = '<div style="padding:16px;color:#f2c94c;font-size:14px">Something went wrong starting the app.<br><br>' + String(e.message || e).replace(/</g, '&lt;') + '</div>';
});
</script>
<script src="capacitor.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
