name: Build Android app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['docs/**', 'android/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mindful.apk
      - name: List the web files packed into the APK
        run: unzip -l mindful.apk | grep "assets/public/"
      - uses: actions/upload-artifact@v4
        with: { name: mindful-apk, path: mindful.apk }
      - name: Point the release tag at this build
        run: |
          git tag -f latest-apk "$GITHUB_SHA"
          git push -f origin latest-apk
      - name: Publish latest APK
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: Mindful (latest Android build)
          body: Install `mindful.apk` on your Android phone. Built from ${{ github.sha }}.
          artifacts: mindful.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          commit: ${{ github.sha }}

  smoke:
    # Installs the built APK in a real Android emulator and prints what the app shows, so problems are visible here.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mindful-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshots, path: smoke-*.png }
