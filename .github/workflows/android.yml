name: Build Android app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['docs/**', 'android/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Stamp the build number into the app
        run: echo "export const BUILD = '${{ github.run_number }}';" > docs/build.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mindcue.apk
          cp mindcue.apk mindtap.apk   # old file names, so links and QR codes made before the renames keep working
          cp mindcue.apk mindful.apk
      - name: List the web files packed into the APK
        run: unzip -l mindcue.apk | grep "assets/public/"
      - uses: actions/upload-artifact@v4
        with: { name: mindcue-apk, path: mindcue.apk }
      - name: Publish the APK as a fresh release
        # Recreated every build so the release shows a new date and "build N" instead of looking unchanged.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          cat > notes.md <<NOTES
          ## Install MindCue (Android phones only)
          **Easiest:** tap **mindcue.apk** under *Assets* below, then follow these steps.

          1. If the phone says the file "can harm your device", tap **Download anyway**, then **Open**.
          2. If it says it isn't allowed to install unknown apps from this source, tap **Settings**, switch on **Allow from this source**, then press Back.
          3. Tap **Install**.
          4. If **Google Play Protect** appears, tap **More details**, then **Install anyway**. (Not "Got it" or "OK" - those do not install it.)
          5. Open MindCue and tap **Allow notifications**.

          Already have MindCue? Install this over it - your settings stay. If it says "App not installed", uninstall the old copy first.
          The bottom of the Today screen shows **MindCue - build ${{ github.run_number }}** so you can tell which version you have.

          Printable one-page guide with a QR code: https://github.com/${GITHUB_REPOSITORY}/blob/main/share/MindCue-install-guide.pdf

          (mindful.apk is the same file under its old name, so older links still work.)

          _Built from ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})._
          NOTES
          gh release create latest-apk mindcue.apk mindtap.apk mindful.apk --target "$GITHUB_SHA" --latest \
            --title "MindCue build ${{ github.run_number }}" --notes-file notes.md

  smoke:
    # Installs the built APK in a real Android emulator and prints what the app shows, so problems are visible here.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mindcue-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshots, path: smoke-*.png }
